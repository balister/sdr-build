image: localhost/local/oebuild

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build-job:
  stage: build
  variables:
    SSTATE_DIR: /cache/sstate
    DL_DIR: /cache/downloads
    TMPDIR: /cache/$CI_COMMIT_BRANCH/tmp
  script:
    - rm -rf build
    - TEMPLATECONF=`pwd`/meta-sdr/conf/templates/default  source ./openembedded-core/oe-init-build-env ./build ./bitbake
    - echo "DL_DIR = \"$DL_DIR\"" > conf/auto.conf
    - echo "SSTATE_DIR = \"$SSTATE_DIR\"" >> conf/auto.conf
    - echo "TMPDIR = \"$TMPDIR\"" >> conf/auto.conf
    - cat conf/auto.conf
    - bitbake gnuradio-dev-image

test-job1:
  stage: test
  script:
    - echo "This job tests something"

test-job2:
  stage: test
  script:
    - echo "This job tests something, but takes more time than test-job1."
    - echo "After the echo commands complete, it runs the sleep command for 20 seconds"
    - echo "which simulates a test that runs 20 seconds longer than test-job1"
    - sleep 20

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production
