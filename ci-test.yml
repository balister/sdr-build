labgrid-tests:

  variables:
#    CI_DEBUG_TRACE: "true"

  stage: test

  before_script:
    - source /home/oebuilds/labgrid-venv/bin/activate
    - labgrid-client -x 192.168.11.221 -p $PLACE acquire

  script:
    - mkdir -p $CACHE_TMP
    - rsync -a balister@bushey:opensdr/oe-shared/$MACHINE $CACHE_TMP
    - source /home/oebuilds/labgrid-venv/bin/activate
    - cd meta-sdr/contrib/labgrid
    - ls
    - pwd
    - mkdir -p images
    # Flash and test each image in turn; keep going after a failure so every
    # image gets tested, then fail the job if any of them failed.
    - |
      failed=""
      for image in $TEST_IMAGES; do
        echo "=== $image"
        output=$CACHE_TMP/$MACHINE/$image-$MACHINE.rootfs.wic
        cp $output.$IMAGE_COMPRESSION images/image.wic.$IMAGE_COMPRESSION
        cp $output.bmap images/image.wic.bmap
        pytest --lg-coordinator=192.168.11.221 --lg-env $PLACE_CONFIG test_ptest.py || failed="$failed $image"
      done
      if [ -n "$failed" ]; then
        echo "ptest failures in:$failed"
        exit 1
      fi

  after_script:
    - source /home/oebuilds/labgrid-venv/bin/activate
    - labgrid-client -x 192.168.11.221 -p $PLACE power off
    - labgrid-client -x 192.168.11.221 -p $PLACE release


