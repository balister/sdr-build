.bitbake-env:
  script:
    - rm -rf build
    - TEMPLATECONF=`pwd`$TEMPLATE_PATH  source ./openembedded-core/oe-init-build-env ./build ./bitbake
    - echo "DL_DIR = \"$DL_DIR\"" > conf/auto.conf
    - echo "SSTATE_DIR = \"$SSTATE_DIR\"" >> conf/auto.conf
    - echo "BB_HASHSERVE = \"$BB_HASHSERVE\"" >> conf/auto.conf
    - echo "TMPDIR = \"$TMPDIR\"" >> conf/auto.conf
    - echo "MACHINE = \"$MACHINE\"" >> conf/auto.conf
    # Don't start new tasks while the builder is short of memory; the
    # gnuradio4 test compiles take up to 7.4 GB each.
    - echo "BB_PRESSURE_MAX_MEMORY = \"15000\"" >> conf/auto.conf

build-job:
  stage: build
  variables:

  script:
    - !reference [.bitbake-env, script]
    - cat conf/auto.conf
    - bitbake $BUILD_IMAGES $TEST_IMAGES
    - rsync -a --del $TMPDIR/deploy/images/$MACHINE balister@bushey:opensdr/oe-shared/
