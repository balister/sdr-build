variables:
  GIT_SUBMODULE_STRATEGY: recursive
# Variables for build and other parts of CI
  SSTATE_DIR: /shared/sstate
  BB_HASHSERVE: bushey:8686
  CACHE_TMP: /cache/tmp
  DL_DIR: /shared/downloads
  TMPDIR: $CACHE_TMP/$CI_COMMIT_BRANCH/tmp
  MACHINE: qemuarm64
  TEMPLATE_PATH: /meta-sdr/conf/templates/default
# Images that are only built
  BUILD_IMAGES: gnuradio-dev-image gnuradio4-image
# Images that are built, and then tested in the test stage
  TEST_IMAGES: gnuradio4-ptest-image gnuradio-ptest-image
# Variables for test part of CI
  PLACE: pi5
  PLACE_CONFIG: pi5.yaml
# Compression suffix of the wic image the board's labgrid config flashes
# (bz2 for pi5.yaml, gz for beaglev-fire.yaml)
  IMAGE_COMPRESSION: bz2
